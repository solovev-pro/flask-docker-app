<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Догоняй — Сферум-сервис</title>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333;">
  
  <nav style="position: fixed; top: 0; left: 0; width: 100%; background: #ffffff; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
      
      <div style="font-weight: bold; font-size: 1.2em; color: #007bff;">
        🎓 Догоняй
      </div>
      
      <div style="display: flex; gap: 10px; align-items: center;">
        
      </div>
    </div>
  </nav>

  <main style="padding: 110px 20px 40px; max-width: 1200px; margin: 0 auto;">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
